<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style>
      .class-box { fill: #f9f9f9; stroke: #333; stroke-width: 1.5; }
      .abstract-class { fill: #e8f4fd; stroke: #1976d2; stroke-width: 2; }
      .class-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .class-content { font-family: Arial, sans-serif; font-size: 11px; text-anchor: start; }
      .inheritance-line { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- FitData (Abstract Base) -->
  <rect x="450" y="20" width="300" height="180" class="abstract-class" rx="5"/>
  <text x="600" y="40" class="class-title">FitData</text>
  <text x="600" y="55" class="class-title" style="font-size: 12px; font-style: italic;">&lt;&lt;abstract&gt;&gt;</text>
  <line x1="460" y1="65" x2="740" y2="65" stroke="#333" stroke-width="1"/>
  <text x="465" y="80" class="class-content">+RawData : double</text>
  <text x="465" y="95" class="class-content">+IsOverride : logical</text>
  <text x="465" y="110" class="class-content">+StartPoint : double</text>
  <text x="465" y="125" class="class-content">+Coefficient : double</text>
  <text x="465" y="140" class="class-content">+Result : fitobject</text>
  <line x1="460" y1="150" x2="740" y2="150" stroke="#333" stroke-width="1"/>
  <text x="465" y="165" class="class-content">+setFormula()* </text>
  <text x="465" y="180" class="class-content">+do()* </text>
  <text x="465" y="195" class="class-content">+plot()*</text>
  
  <!-- FitData1D (Abstract) -->
  <rect x="450" y="250" width="300" height="120" class="abstract-class" rx="5"/>
  <text x="600" y="270" class="class-title">FitData1D</text>
  <text x="600" y="285" class="class-title" style="font-size: 12px; font-style: italic;">&lt;&lt;abstract&gt;&gt;</text>
  <line x1="460" y1="295" x2="740" y2="295" stroke="#333" stroke-width="1"/>
  <text x="465" y="310" class="class-content">+FitPlotData : double</text>
  <text x="465" y="325" class="class-content">+DataSize : double</text>
  <line x1="460" y1="335" x2="740" y2="335" stroke="#333" stroke-width="1"/>
  <text x="465" y="350" class="class-content">+evaluateFit()</text>
  <text x="465" y="365" class="class-content">+plot()</text>
  
  <!-- Inheritance line from FitData to FitData1D -->
  <line x1="600" y1="200" x2="600" y2="250" class="inheritance-line"/>
  
  <!-- Concrete classes - Top row -->
  <!-- LinearFit1D -->
  <rect x="50" y="420" width="150" height="80" class="class-box" rx="5"/>
  <text x="125" y="440" class="class-title">LinearFit1D</text>
  <line x1="60" y1="450" x2="190" y2="450" stroke="#333" stroke-width="1"/>
  <text x="65" y="465" class="class-content">+setFormula()</text>
  <text x="65" y="480" class="class-content">+guessCoefficient()</text>
  
  <!-- ParabolicFit1D -->
  <rect x="220" y="420" width="150" height="80" class="class-box" rx="5"/>
  <text x="295" y="440" class="class-title">ParabolicFit1D</text>
  <line x1="230" y1="450" x2="360" y2="450" stroke="#333" stroke-width="1"/>
  <text x="235" y="465" class="class-content">+setFormula()</text>
  <text x="235" y="480" class="class-content">+guessCoefficient()</text>
  
  <!-- GaussianFit1D -->
  <rect x="390" y="420" width="150" height="80" class="class-box" rx="5"/>
  <text x="465" y="440" class="class-title">GaussianFit1D</text>
  <line x1="400" y1="450" x2="530" y2="450" stroke="#333" stroke-width="1"/>
  <text x="405" y="465" class="class-content">+setFormula()</text>
  <text x="405" y="480" class="class-content">+guessCoefficient()</text>
  
  <!-- SineFit1D -->
  <rect x="560" y="420" width="150" height="80" class="class-box" rx="5"/>
  <text x="635" y="440" class="class-title">SineFit1D</text>
  <line x1="570" y1="450" x2="700" y2="450" stroke="#333" stroke-width="1"/>
  <text x="575" y="465" class="class-content">+setFormula()</text>
  <text x="575" y="480" class="class-content">+guessCoefficient()</text>
  
  <!-- TriangleFit1D -->
  <rect x="730" y="420" width="150" height="80" class="class-box" rx="5"/>
  <text x="805" y="440" class="class-title">TriangleFit1D</text>
  <line x1="740" y1="450" x2="870" y2="450" stroke="#333" stroke-width="1"/>
  <text x="745" y="465" class="class-content">+setFormula()</text>
  <text x="745" y="480" class="class-content">+guessCoefficient()</text>
  
  <!-- Bottom row -->
  <!-- BosonicBimodalFit1D -->
  <rect x="200" y="550" width="180" height="100" class="class-box" rx="5"/>
  <text x="290" y="570" class="class-title">BosonicBimodalFit1D</text>
  <line x1="210" y1="580" x2="370" y2="580" stroke="#333" stroke-width="1"/>
  <text x="215" y="595" class="class-content">+ScaleFactor : double</text>
  <line x1="210" y1="605" x2="370" y2="605" stroke="#333" stroke-width="1"/>
  <text x="215" y="620" class="class-content">+setFormula()</text>
  <text x="215" y="635" class="class-content">+do()</text>
  
  <!-- BosonicGaussianFit1D -->
  <rect x="400" y="550" width="180" height="80" class="class-box" rx="5"/>
  <text x="490" y="570" class="class-title">BosonicGaussianFit1D</text>
  <line x1="410" y1="580" x2="570" y2="580" stroke="#333" stroke-width="1"/>
  <text x="415" y="595" class="class-content">+setFormula()</text>
  <text x="415" y="610" class="class-content">+guessCoefficient()</text>
  
  <!-- SqrtParabolicFit1D -->
  <rect x="600" y="550" width="180" height="80" class="class-box" rx="5"/>
  <text x="690" y="570" class="class-title">SqrtParabolicFit1D</text>
  <line x1="610" y1="580" x2="770" y2="580" stroke="#333" stroke-width="1"/>
  <text x="615" y="595" class="class-content">+setFormula()</text>
  <text x="615" y="610" class="class-content">+guessCoefficient()</text>
  
  <!-- Inheritance lines from FitData1D to concrete classes -->
  <!-- Top row inheritance lines -->
  <line x1="125" y1="420" x2="125" y2="390" class="inheritance-line"/>
  <line x1="125" y1="390" x2="550" y2="390" stroke="#333" stroke-width="1"/>
  <line x1="550" y1="390" x2="550" y2="370" class="inheritance-line"/>
  
  <line x1="295" y1="420" x2="295" y2="390" class="inheritance-line"/>
  <line x1="465" y1="420" x2="465" y2="390" class="inheritance-line"/>
  <line x1="635" y1="420" x2="635" y2="390" class="inheritance-line"/>
  <line x1="805" y1="420" x2="805" y2="390" class="inheritance-line"/>
  
  <!-- Bottom row inheritance lines -->
  <line x1="290" y1="550" x2="290" y2="390" class="inheritance-line"/>
  <line x1="490" y1="550" x2="490" y2="390" class="inheritance-line"/>
  <line x1="690" y1="550" x2="690" y2="390" class="inheritance-line"/>
  
</svg>
