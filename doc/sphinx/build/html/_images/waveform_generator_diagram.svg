<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <style>
      .class-box { fill: #f9f9f9; stroke: #333; stroke-width: 1.5; }
      .abstract-class { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .concrete-class { fill: #e8f5e8; stroke: #2e7d32; stroke-width: 2; }
      .vendor-class { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
      .class-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .class-content { font-family: Arial, sans-serif; font-size: 11px; text-anchor: start; }
      .inheritance-line { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Hardware Base Class -->
  <rect x="350" y="50" width="300" height="150" class="abstract-class" rx="8"/>
  <text x="500" y="75" class="class-title">Hardware</text>
  <text x="500" y="90" class="class-title" style="font-size: 12px; font-style: italic;">&lt;&lt;abstract&gt;&gt;</text>
  <line x1="360" y1="100" x2="640" y2="100" stroke="#333" stroke-width="1"/>
  <text x="365" y="120" class="class-content">+Name : string</text>
  <text x="365" y="135" class="class-content">+Manufacturer : string</text>
  <text x="365" y="150" class="class-content">+Model : string</text>
  <text x="365" y="165" class="class-content">+ResourceName : string</text>
  <text x="520" y="120" class="class-content">+NChannel : double</text>
  <text x="520" y="135" class="class-content">+Memory : double</text>
  <text x="520" y="150" class="class-content">+DataType : string</text>
  <text x="520" y="165" class="class-content">+DisabledProperty : string</text>
  <line x1="360" y1="175" x2="640" y2="175" stroke="#333" stroke-width="1"/>
  <text x="365" y="190" class="class-content">+saveObject()</text>
  
  <!-- WaveformGenerator Abstract Class -->
  <rect x="300" y="250" width="400" height="200" class="abstract-class" rx="8"/>
  <text x="500" y="275" class="class-title">WaveformGenerator</text>
  <text x="500" y="290" class="class-title" style="font-size: 12px; font-style: italic;">&lt;&lt;abstract&gt;&gt;</text>
  <line x1="310" y1="300" x2="690" y2="300" stroke="#333" stroke-width="1"/>
  <text x="315" y="320" class="class-content">+SamplingRate : double</text>
  <text x="315" y="335" class="class-content">+TriggerSource : string</text>
  <text x="315" y="350" class="class-content">+TriggerSlope : string</text>
  <text x="315" y="365" class="class-content">+OutputMode : string</text>
  <text x="520" y="320" class="class-content">+IsOutput : logical</text>
  <text x="520" y="335" class="class-content">+OutputLoad : string</text>
  <text x="520" y="350" class="class-content">+WaveformList : cell</text>
  <text x="520" y="365" class="class-content">+SamplingRateLimit : double</text>
  <text x="520" y="380" class="class-content">+OutputLimit : double(1,2)</text>
  <line x1="310" y1="390" x2="690" y2="390" stroke="#333" stroke-width="1"/>
  <text x="315" y="410" class="class-content">+connect()* </text>
  <text x="315" y="425" class="class-content">+set()* </text>
  <text x="315" y="440" class="class-content">+upload()* </text>
  <text x="520" y="410" class="class-content">+close()* </text>
  <text x="520" y="425" class="class-content">+check()* </text>
  
  <!-- KeysightWaveformGenerator -->
  <rect x="50" y="500" width="300" height="150" class="vendor-class" rx="8"/>
  <text x="200" y="525" class="class-title">KeysightWaveformGenerator</text>
  <text x="200" y="540" class="class-title" style="font-size: 12px; font-style: italic;">&lt;&lt;abstract&gt;&gt;</text>
  <line x1="60" y1="550" x2="340" y2="550" stroke="#333" stroke-width="1"/>
  <text x="65" y="570" class="class-content">+VisaDevice : visadev</text>
  <line x1="60" y1="580" x2="340" y2="580" stroke="#333" stroke-width="1"/>
  <text x="65" y="600" class="class-content">+connect() : VISA setup</text>
  <text x="65" y="615" class="class-content">+set() : SCPI configuration</text>
  <text x="65" y="630" class="class-content">+upload() : Binary transfer</text>
  <text x="200" y="600" class="class-content">+trigger() : Software trigger</text>
  <text x="200" y="615" class="class-content">+close() : VISA cleanup</text>
  <text x="200" y="630" class="class-content">+check() : Error query</text>
  
  <!-- SpectrumWaveformGenerator -->
  <rect x="400" y="500" width="300" height="150" class="vendor-class" rx="8"/>
  <text x="550" y="525" class="class-title">SpectrumWaveformGenerator</text>
  <text x="550" y="540" class="class-title" style="font-size: 12px; font-style: italic;">&lt;&lt;abstract&gt;&gt;</text>
  <line x1="410" y1="550" x2="690" y2="550" stroke="#333" stroke-width="1"/>
  <text x="415" y="570" class="class-content">+Device : spectrum device</text>
  <text x="415" y="585" class="class-content">+RegMap : register mapping</text>
  <text x="415" y="600" class="class-content">+ErrorMap : error codes</text>
  <line x1="410" y1="610" x2="690" y2="610" stroke="#333" stroke-width="1"/>
  <text x="415" y="630" class="class-content">High-speed segment-based AWG</text>
  <text x="415" y="645" class="class-content">PCI/PCIe interface</text>
  
  <!-- Concrete Keysight Models -->
  <rect x="50" y="680" width="120" height="60" class="concrete-class" rx="5"/>
  <text x="110" y="705" class="class-title" style="font-size: 12px;">Keysight33500B</text>
  <text x="110" y="720" class="class-content" style="font-size: 10px;">2-ch, 250 MS/s</text>
  
  <rect x="190" y="680" width="120" height="60" class="concrete-class" rx="5"/>
  <text x="250" y="705" class="class-title" style="font-size: 12px;">Keysight33600A</text>
  <text x="250" y="720" class="class-content" style="font-size: 10px;">2-ch, 1 GS/s</text>
  
  <!-- Concrete Spectrum Models -->
  <rect x="450" y="680" width="140" height="60" class="concrete-class" rx="5"/>
  <text x="520" y="705" class="class-title" style="font-size: 12px;">SpectrumDN2662_02</text>
  <text x="520" y="720" class="class-content" style="font-size: 10px;">2-ch, 1.25 GS/s</text>
  
  <!-- Integration Box -->
  <rect x="750" y="300" width="220" height="200" class="class-box" rx="8"/>
  <text x="860" y="325" class="class-title">Integration</text>
  <line x1="760" y1="335" x2="960" y2="335" stroke="#333" stroke-width="1"/>
  <text x="765" y="355" class="class-content" style="font-weight: bold;">Uses:</text>
  <text x="765" y="370" class="class-content">• Waveform classes</text>
  <text x="765" y="385" class="class-content">• WaveformList sequences</text>
  <text x="765" y="400" class="class-content">• VISA communication</text>
  <text x="765" y="415" class="class-content">• SCPI commands</text>
  <text x="765" y="430" class="class-content">• Binary data transfer</text>
  <text x="765" y="455" class="class-content" style="font-weight: bold;">Features:</text>
  <text x="765" y="470" class="class-content">• Multi-channel sync</text>
  <text x="765" y="485" class="class-content">• Hardware optimization</text>
  
  <!-- Inheritance Lines -->
  <!-- Hardware to WaveformGenerator -->
  <line x1="500" y1="200" x2="500" y2="250" class="inheritance-line"/>
  
  <!-- WaveformGenerator to vendor classes -->
  <line x1="200" y1="500" x2="200" y2="470" class="inheritance-line"/>
  <line x1="200" y1="470" x2="450" y2="470" stroke="#333" stroke-width="1"/>
  <line x1="450" y1="470" x2="450" y2="450" class="inheritance-line"/>
  
  <line x1="550" y1="500" x2="550" y2="450" class="inheritance-line"/>
  
  <!-- Vendor classes to concrete models -->
  <line x1="110" y1="680" x2="110" y2="660" class="inheritance-line"/>
  <line x1="110" y1="660" x2="170" y2="660" stroke="#333" stroke-width="1"/>
  <line x1="170" y1="660" x2="170" y2="650" class="inheritance-line"/>
  
  <line x1="250" y1="680" x2="250" y2="660" class="inheritance-line"/>
  <line x1="250" y1="660" x2="170" y2="660" stroke="#333" stroke-width="1"/>
  
  <line x1="520" y1="680" x2="520" y2="650" class="inheritance-line"/>
  
</svg>
