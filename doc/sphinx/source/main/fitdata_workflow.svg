<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <style>
      .start-end { fill: #e1f5fe; stroke: #01579b; stroke-width: 2; }
      .process { fill: #fff3e0; stroke: #e65100; stroke-width: 2; }
      .decision { fill: #fff; stroke: #333; stroke-width: 2; }
      .success { fill: #e8f5e8; stroke: #2e7d32; stroke-width: 2; }
      .visualization { fill: #fce4ec; stroke: #c2185b; stroke-width: 2; }
      .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .small-text { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Start -->
  <rect x="300" y="20" width="200" height="60" class="start-end" rx="30"/>
  <text x="400" y="40" class="text">Experimental Data</text>
  <text x="400" y="55" class="small-text">[x, y] coordinates</text>
  
  <!-- Choose Fit Type -->
  <rect x="250" y="120" width="300" height="80" class="process" rx="10"/>
  <text x="400" y="145" class="text">Choose Fit Type</text>
  <text x="400" y="160" class="small-text">LinearFit1D, GaussianFit1D,</text>
  <text x="400" y="175" class="small-text">SineFit1D, etc.</text>
  
  <!-- Create Fit Object -->
  <rect x="250" y="240" width="300" height="60" class="process" rx="10"/>
  <text x="400" y="265" class="text">Create Fit Object</text>
  <text x="400" y="280" class="small-text">fitObj = GaussianFit1D(data)</text>
  
  <!-- Decision: Custom Parameters? -->
  <polygon points="400,340 480,380 400,420 320,380" class="decision"/>
  <text x="400" y="375" class="text">Need Custom</text>
  <text x="400" y="390" class="text">Parameters?</text>
  
  <!-- Automatic Parameters (Left branch) -->
  <rect x="100" y="480" width="200" height="60" class="process" rx="10"/>
  <text x="200" y="505" class="text">Use Automatic</text>
  <text x="200" y="520" class="small-text">Parameter Estimation</text>
  
  <!-- Custom Parameters (Right branch) -->
  <rect x="500" y="460" width="250" height="100" class="process" rx="10"/>
  <text x="625" y="485" class="text">Set Override Parameters</text>
  <text x="625" y="500" class="small-text">fitObj.IsOverride = true</text>
  <text x="625" y="515" class="small-text">fitObj.StartPointOverride = [...]</text>
  <text x="625" y="530" class="small-text">fitObj.LowerOverride = [...]</text>
  <text x="625" y="545" class="small-text">fitObj.UpperOverride = [...]</text>
  
  <!-- Execute Fit -->
  <rect x="300" y="600" width="200" height="60" class="process" rx="10"/>
  <text x="400" y="625" class="text">Execute Fit</text>
  <text x="400" y="640" class="small-text">fitObj.do()</text>
  
  <!-- Retrieve Results -->
  <rect x="250" y="700" width="300" height="80" class="process" rx="10"/>
  <text x="400" y="725" class="text">Retrieve Results</text>
  <text x="400" y="740" class="small-text">coefficients = fitObj.Coefficient</text>
  <text x="400" y="755" class="small-text">goodness = fitObj.Gof</text>
  
  <!-- Visualize Results -->
  <rect x="300" y="820" width="200" height="60" class="visualization" rx="10"/>
  <text x="400" y="845" class="text">Visualize Results</text>
  <text x="400" y="860" class="small-text">fitObj.plot()</text>
  
  <!-- Decision: Fit Quality Acceptable? -->
  <polygon points="400,920 480,960 400,1000 320,960" class="decision"/>
  <text x="400" y="955" class="text">Fit Quality</text>
  <text x="400" y="970" class="text">Acceptable?</text>
  
  <!-- Adjust Parameters (Left branch from quality check) -->
  <rect x="50" y="820" width="200" height="80" class="process" rx="10"/>
  <text x="150" y="845" class="text">Adjust Parameters</text>
  <text x="150" y="860" class="small-text">or Try Different</text>
  <text x="150" y="875" class="small-text">Fit Type</text>
  
  <!-- Success -->
  <rect x="550" y="930" width="200" height="60" class="success" rx="10"/>
  <text x="650" y="955" class="text">Use Results</text>
  <text x="650" y="970" class="small-text">for Analysis</text>
  
  <!-- Arrows -->
  <!-- Start to Choose Fit Type -->
  <line x1="400" y1="80" x2="400" y2="120" class="arrow"/>
  
  <!-- Choose Fit Type to Create Object -->
  <line x1="400" y1="200" x2="400" y2="240" class="arrow"/>
  
  <!-- Create Object to Decision -->
  <line x1="400" y1="300" x2="400" y2="340" class="arrow"/>
  
  <!-- Decision to Automatic (No) -->
  <line x1="320" y1="380" x2="200" y2="380" class="arrow"/>
  <line x1="200" y1="380" x2="200" y2="480" class="arrow"/>
  <text x="260" y="375" class="small-text">No</text>
  
  <!-- Decision to Custom (Yes) -->
  <line x1="480" y1="380" x2="625" y2="380" class="arrow"/>
  <line x1="625" y1="380" x2="625" y2="460" class="arrow"/>
  <text x="540" y="375" class="small-text">Yes</text>
  
  <!-- Automatic to Execute -->
  <line x1="200" y1="540" x2="200" y2="630" class="arrow"/>
  <line x1="200" y1="630" x2="300" y2="630" class="arrow"/>
  
  <!-- Custom to Execute -->
  <line x1="625" y1="560" x2="625" y2="630" class="arrow"/>
  <line x1="625" y1="630" x2="500" y2="630" class="arrow"/>
  
  <!-- Execute to Retrieve -->
  <line x1="400" y1="660" x2="400" y2="700" class="arrow"/>
  
  <!-- Retrieve to Visualize -->
  <line x1="400" y1="780" x2="400" y2="820" class="arrow"/>
  
  <!-- Visualize to Quality Check -->
  <line x1="400" y1="880" x2="400" y2="920" class="arrow"/>
  
  <!-- Quality Check to Adjust (No) -->
  <line x1="320" y1="960" x2="150" y2="960" class="arrow"/>
  <line x1="150" y1="960" x2="150" y2="900" class="arrow"/>
  <text x="235" y="955" class="small-text">No</text>
  
  <!-- Quality Check to Success (Yes) -->
  <line x1="480" y1="960" x2="650" y2="960" class="arrow"/>
  <text x="565" y="955" class="small-text">Yes</text>
  
  <!-- Adjust back to Custom Parameters -->
  <line x1="150" y1="820" x2="150" y2="510" class="arrow"/>
  <line x1="150" y1="510" x2="500" y2="510" class="arrow"/>
  
</svg>
