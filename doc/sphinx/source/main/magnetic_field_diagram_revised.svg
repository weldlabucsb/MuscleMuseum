<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <style>
      .class-box { fill: #f9f9f9; stroke: #333; stroke-width: 1.5; }
      .field-class { fill: #e8f5e8; stroke: #2e7d32; stroke-width: 2; }
      .class-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .class-content { font-family: Arial, sans-serif; font-size: 11px; text-anchor: start; }
    </style>
  </defs>
  
  <!-- MagneticField Class -->
  <rect x="200" y="50" width="400" height="200" class="field-class" rx="8"/>
  <text x="400" y="75" class="class-title">MagneticField</text>
  <line x1="210" y1="85" x2="590" y2="85" stroke="#333" stroke-width="1"/>
  
  <!-- Properties -->
  <text x="215" y="105" class="class-content">+Bias : double(3,1)</text>
  <text x="215" y="120" class="class-content">+Gradient : double(3,3)</text>
  <text x="215" y="135" class="class-content">+Quadratic : double(3,3,3)</text>
  <text x="215" y="150" class="class-content">+ArbitraryDistribution : function_handle</text>
  
  <!-- Dependent Properties -->
  <text x="415" y="105" class="class-content">+BiasLu : double(3,1)</text>
  <text x="415" y="120" class="class-content">+GradientLu : double(3,3)</text>
  <text x="415" y="135" class="class-content">+FieldZero : double(3,1)</text>
  
  <line x1="210" y1="160" x2="590" y2="160" stroke="#333" stroke-width="1"/>
  
  <!-- Methods -->
  <text x="215" y="180" class="class-content">+spaceFunc()</text>
  <text x="215" y="195" class="class-content">Returns function handle B(r)</text>
  <text x="215" y="210" class="class-content">Evaluates field at position r</text>
  <text x="215" y="225" class="class-content">Handles bias + gradient + custom distributions</text>
  
  <!-- Key Features Box -->
  <rect x="50" y="300" width="700" height="150" class="class-box" rx="8"/>
  <text x="400" y="325" class="class-title">MagneticField Key Features</text>
  <line x1="60" y1="335" x2="740" y2="335" stroke="#333" stroke-width="1"/>
  
  <text x="70" y="360" class="class-content" style="font-weight: bold;">Field Components:</text>
  <text x="70" y="375" class="class-content">• Uniform bias fields B₀ = (Bₓ, Bᵧ, Bᵤ)</text>
  <text x="70" y="390" class="class-content">• Linear gradients ∂Bᵢ/∂xⱼ for magnetic traps</text>
  <text x="70" y="405" class="class-content">• Arbitrary spatial distributions B(r) via function handles</text>
  <text x="70" y="420" class="class-content">• Automatic unit conversions (Tesla ↔ Gauss)</text>
  
  <text x="400" y="360" class="class-content" style="font-weight: bold;">Common Applications:</text>
  <text x="400" y="375" class="class-content">• Quadrupole magnetic traps</text>
  <text x="400" y="390" class="class-content">• Ioffe-Pritchard configurations</text>
  <text x="400" y="405" class="class-content">• Anti-Helmholtz coil geometries</text>
  <text x="400" y="420" class="class-content">• Custom field distributions</text>
  
</svg>
